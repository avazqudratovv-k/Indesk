# Dev stack. Only the API is published on the host (127.0.0.1:8000); db and redis stay inside the network.
# The password defaults below are dev-only. Real secrets go in api/.env (ignored by git), never here.
# Three database logins: `indesk` (superuser, db healthcheck only), `indesk_migrator` (owns the
# schema, used by the one-shot `migrate` service) and `indesk_app` (rows only, used by api, worker
# and scheduler). compose.override.yaml adds the dev-only mounts; compose.prod.yaml is the production
# skeleton.
name: indesk

x-api-env: &api-env
  APP_ENV: development
  DATABASE_URL: postgresql+psycopg://indesk_app:${POSTGRES_APP_PASSWORD:-indesk_app_dev_password}@db:5432/indesk
  REDIS_URL: redis://redis:6379/0

services:
  api:
    build: ./api
    env_file:
      - path: ./api/.env
        required: false
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - parse_net # reaches the parser service only (P14a); the sandbox is not on this network
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: applies the migrations as the schema owner, then exits. api, worker and scheduler wait
  # for it. It gets the migrator's URL only: no env_file, no Gemini key, no Redis.
  migrate:
    build: ./api
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATE_DATABASE_URL: postgresql+psycopg://indesk_migrator:${POSTGRES_MIGRATOR_PASSWORD:-indesk_migrator_dev_password}@db:5432/indesk
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./api
    command: ["python", "-m", "app.jobs.worker"]
    env_file:
      - path: ./api/.env
        required: false
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    networks:
      - default
      - sandbox_net # the only service that can reach the sandbox
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Enqueues the hourly expiry sweep (RQ CronScheduler). Run exactly one of these.
  scheduler:
    build: ./api
    command: ["python", "-m", "app.jobs.scheduler"]
    env_file:
      - path: ./api/.env
        required: false
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.scheduler_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Runs model-written pandas code (ROADMAP 3.7). THE CONTAINER IS THE SECURITY BOUNDARY: no network,
  # read-only root, no capabilities, hard memory/process/CPU limits. The kernel is shared with the
  # host, so this narrows the risk; it does not remove it. Nothing is mounted and it gets no
  # environment at all: no env_file, no DATABASE_URL, no AUTH_SECRET. tests/test_compose_sandbox.py
  # fails if any of that changes.
  sandbox:
    build: ./api/sandbox
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 3g
    memswap_limit: 3g # no swap
    cpus: 2
    restart: unless-stopped
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Reads uploaded PDFs for the api (P14a). The SAME image as the sandbox with a parse-only entrypoint: it
  # serves only /parse-pdf and /health (no /run), and no model-written code ever reaches it. Same hardening as
  # the sandbox, on its own internal network shared with the api only (parse_net), so the sandbox that runs
  # model code has no route to the api and the parser has no route to db, redis, the sandbox or the internet.
  # No environment, no mounts, no published ports. Memory: a parse job is capped at 1280 MiB of address space
  # and used under 400 MB resident in the stream-bomb test; 1 GiB leaves room for the server around it.
  parser:
    build: ./api/sandbox
    command: ["python", "-m", "indesk_sandbox.parser_server"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    memswap_limit: 1g # no swap
    cpus: 1
    restart: unless-stopped
    networks:
      - parse_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: indesk
      POSTGRES_DB: indesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indesk_dev_password}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-indesk_migrator_dev_password}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-indesk_app_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the two roles when the volume is first made (needs `down -v` to run again).
      - ./api/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indesk -d indesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # No route to the internet or to db, redis and api. Shared only by the worker and the sandbox.
  sandbox_net:
    internal: true
  # No route to the internet or to db, redis, worker and sandbox. Shared only by the api and the parser.
  parse_net:
    internal: true

volumes:
  pgdata:
  uploads:
