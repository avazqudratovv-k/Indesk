# Product limits: the one place the server reads them from (ROADMAP 3.6). Every number names the doc it came from.
# web/lib/workspace/validate.ts and web/mocks/plans.json still hold their own copies of some of these.

# Largest upload in bytes, Free plan: 5 MB. DECISIONS #79 (replaces the 2 MB in the old DATA.md); DATA.md uploads.size.
max_file_bytes = 5242880

# Most data rows (header not counted) in a CSV, Free plan. Raised from 5,000 on 2026-10-27: the model sees only
# column names and a sample, so rows cost no tokens; the 5 MB file cap above still bounds the work. The web copy
# (messages, plans.json) states the same number.
max_rows = 20000

# Most columns in a CSV, Free plan. Owner decision for P5 (no doc gives a number).
max_columns = 200

# Uploads one user may attempt per hour (fixed window in Redis). Owner decision for P5; SECURITY.md risk 2.
uploads_per_hour = 30

# Longest display filename in characters. DATA.md uploads.filename "max 255 (rec)", accepted by DECISIONS #25.
max_filename_chars = 255

# Hours an upload lives before the sweep deletes it. DATA.md uploads.expires_at "created_at + 24 h"; DECISIONS #15.
upload_ttl_hours = 24

# Seconds between expiry sweeps. ROADMAP 3.16 "hourly and daily sweeps".
sweep_interval_seconds = 3600

# Model calls per UTC day, all users together. Counts every request to a model, fallback attempts included.
# Values set 2026-10-27 from Gemini Tier 1 limits; caps are a cost guard (about 150 runs/day worst case).
daily_calls_global = 600

# Model calls per UTC day, one user.
daily_calls_per_user = 50

# Longest prompt (system + prompt) the gateway will send, in characters. Owner decision for P6; no doc gives a number.
# It stops a whole CSV from being sent by mistake: the model only sees column names, a sample and results.
max_prompt_chars = 40000

# --- Runs (P7) ---

# Longest question in characters. DATA.md runs.question "max 1,000 (rec)"; DECISIONS #25, #80.
max_question_chars = 1000

# Run requests one user may make per hour (fixed window in Redis; refused ones count too). Owner-approved proposal
# for P7: a flood guard on top of the call caps. DATA.md also names 30 runs a day on paid plans (quota, P10).
runs_per_hour = 20

# Most agent invocations in one run, retries included. AGENTS.md "Step cap 12"; DECISIONS #42.
max_agent_steps = 12

# Soft deadline of a run in seconds, checked before every step and every retry. Owner-approved proposal for P7.
# A model request already running is not interrupted (35 s budget), so the worst case is this plus 35 s.
run_timeout_seconds = 180

# Hard kill of the RQ job, in seconds. Must be above run_timeout_seconds + 35 s + the sandbox call.
run_job_timeout_seconds = 240

# The reaper fails a run that is still unfinished after this long (queued: since created; running: since
# started). Must be above run_job_timeout_seconds so a legitimately slow run is never cut short.
run_hard_limit_seconds = 300

# Seconds between reaper passes in the scheduler.
reaper_interval_seconds = 60

# A run younger than this is never called lost (the job is enqueued just after the row is committed).
reaper_gone_grace_seconds = 30

# Most tokens (in + out, summed from ai_calls) one run may use. Owner-approved proposal for P7: the web mock runs
# use about 20,000, so this is 3x headroom. Stands in for the $0.05 cost cap, which needs a price table (DECISIONS #74).
max_tokens_per_run = 60000

# Live event streams one user may hold open at once.
sse_streams_per_user = 3

# Seconds between database polls of one stream.
sse_poll_seconds = 1

# Seconds between ping comments on an idle stream (proxies close silent connections).
sse_ping_seconds = 15

# A stream closes after this many seconds; the browser reconnects with Last-Event-ID. Above run_hard_limit_seconds.
sse_max_seconds = 330

# --- Run quotas (P10a) ---
#
# HOW THE CAPS INTERACT. Two kinds of daily cap exist and both use the UTC day (app.core.clock.quota_day):
#   - run caps (below): checked once, at POST /runs, before the run is created. Refused with DAILY_CAP_USER / DAILY_CAP_GLOBAL.
#   - model-call caps (daily_calls_per_user / daily_calls_global above): checked by the gateway before every model request.
# A real Ask run makes about 3 model calls (Owl, Beaver, Cat; measured on 20 real runs in the dev database, none needed a
# fallback), and up to 5 when a retry or a fallback model is used. So with the values in this file:
#   - per user: 10 runs x 3 calls = 30 calls, under the 50-call cap. The RUN cap (daily_runs_per_user) binds first.
#   - whole site: 600 calls / 4 per run = 150 runs, matching the 150-run cap (at 3 calls per run, 200 runs fit).
# When you raise one number, raise the other with it: calls needed = runs x 3 to 5.

# Runs one user may start per UTC day. A run that ends rejected (a cap) or model_busy gives its slot back.
daily_runs_per_user = 10

# Runs the whole site may start per UTC day. Same refund rule.
# Values set 2026-10-27 from Gemini Tier 1 limits; caps are a cost guard (about 150 runs/day worst case).
daily_runs_global = 150

# Answered or partial runs a Free-plan user gets in total, not per day (DATA.md usage_events; DECISIONS #195).
# Counted from usage_events. Failed, rejected, busy and not-answerable runs do not use one.
# Values set 2026-10-27 from Gemini Tier 1 limits; caps are a cost guard (about 150 runs/day worst case).
free_runs = 3

# --- Ask agents (P8a) ---

# What the model sees of the CSV. Owner-approved proposal for P8a; no doc gives numbers. The CSV is untrusted data,
# so the model gets column names, dtypes, a few cut-down sample rows and nothing else.
# Sample rows shown to the model.
profile_sample_rows = 5
# Columns shown in the sample (every column name is still listed).
profile_sample_columns = 30
# Longest cell shown, in characters; longer cells are cut.
profile_cell_chars = 40
# Longest column name shown, in characters; longer names are cut (code then cannot use them: a limitation).
profile_name_chars = 60

# Largest computed result stored in agent_steps.payload, in bytes of JSON. DATA.md agent_steps.payload. A bigger result
# fails the run (analysis_failed) instead of being cut, because Cat cannot verify a cut value. The sandbox itself allows 1 MiB.
max_stored_result_bytes = 65536

# --- PDF in Ask (P14a) ---
# The PDF size limit is max_file_bytes (5 MB), the same as a CSV. Parsing runs in the sandbox (pypdf).

# Most pages in a PDF. One limit for everyone (owner answer to the P14 plan, Q2); the demo PDF is 5-30 pages.
max_pdf_pages = 30

# Most extracted characters in a PDF (about 5,000 a page). More is refused with PDF_TOO_MUCH_TEXT.
max_pdf_chars = 150000

# A PDF with less text than this in total counts as a scan or an empty file (PDF_NO_TEXT).
pdf_min_text_chars = 200

# A page counts as "has text" with at least this many characters. Fewer than half of the pages with text is also PDF_NO_TEXT.
pdf_min_page_chars = 20

# Target characters of a chunk, and the characters shared with the next chunk. Chunks never cross a page.
# Owner-approved proposal for P14 (plan section 3); to be tuned on the demo PDF in P14b.
# chunk_chars may not pass 3,000 (the server refuses to start): the embedding model reads 8,192 tokens at most
# per text (Google's model page; owner answer in P14b), and Korean can cost about a token a character.
chunk_chars = 1000
chunk_overlap_chars = 150

# A chunk whose estimated embedding tokens pass this is not embedded: it stays searchable by words and the trace says
# so. Never truncated (a cut text would make a vector of something the passage does not say). At most 6,000.
embed_chunk_max_tokens = 6000

# --- PDF search (P14a part 2) ---

# Embedding tokens (document chunks + question) one run may use, on top of max_tokens_per_run (embedding tokens are NOT
# counted there). A PDF whose chunks need more than this is searched by keywords only. Owner-approved proposal for P14a;
# about 40,000 tokens for a 30-page English PDF, up to about 205000 for dense Korean (budget 250000).
max_embed_tokens_per_run = 250000

# Price of embedding input in USD per 1M tokens, used for the cost estimate in ai_calls.est_cost_usd.
# FROM GOOGLE'S PRICE PAGE, NOT MEASURED. The owner re-checks it in P14b.
embed_usd_per_million_tokens = 0.20

# Hybrid search: take this many nearest chunks by meaning (vector) and this many by words (full text), fuse them with
# reciprocal rank fusion (rank constant retrieval_rrf_k), and keep the best retrieval_keep chunks for the writer.
retrieval_vector_k = 20
retrieval_text_k = 20
retrieval_keep = 6
retrieval_rrf_k = 60

# Score floor. A chunk found by meaning counts only with cosine similarity at or above this; a chunk found by words
# counts only if it holds at least retrieval_min_terms of the question's words. If nothing passes, the run ends
# not_answerable with no writer call. NOT TUNED: 0.5 is a guess for gemini-embedding-2, to be measured in P14b.
retrieval_min_similarity = 0.5
retrieval_min_terms = 2

# --- Missing column (Ask) ---

# When Owl's plan, after its one retry, names a column the file does not have, the run ends not_answerable
# (csv_missing_column) - unless that name is a near-miss of a real column (similarity at or above this, on names
# of 4 or more characters; shorter names must match exactly after normalizing). A near-miss is a model slip, not a
# missing column, so the run still fails as bad_model_output. Owner decision 2026-10-31.
column_match_similarity = 0.85

# --- Daily purge ---

# Rows deleted per batch (each batch is one short transaction; passes repeat until nothing is left).
purge_batch = 200

# A finished run that never made a report is deleted this many days after it finished. The run's usage_events
# row stays (the free-run count), only its run_id becomes NULL.
purge_no_report_days = 30

# ai_calls rows are deleted after this many days. usage_events, usage_daily and audit_log are never purged.
ai_calls_retention_days = 90

# A used or expired email token (password reset, sign-up verification) is deleted this many days after it was used
# or expired. Owner decision 2026-11-02.
email_token_retention_days = 7

# --- Read and delete limits ---

# GET /reports, /reports/{id}, /uploads and /uploads/{id} one user may make per minute, together (fixed window in
# Redis). A flood guard. If Redis is down reads still work (fail open). Owner decision 2026-10-31.
reads_per_minute = 120

# DELETE /reports/{id} and /uploads/{id} one user may make per hour, together. If Redis is down deletes are refused
# with 503 (fail closed). Owner decision 2026-10-31.
deletes_per_hour = 30

# Files per slot of a run. DECISIONS #80 (owner answers for task 2.5). Not enforced by uploads (one file per request);
# POST /runs reads these. Ask takes ONE CSV in v1 (more is refused with TOO_MANY_FILES).
[files_per_slot]
files = 1
document = 1
sources = 4
fileA = 1
fileB = 1
