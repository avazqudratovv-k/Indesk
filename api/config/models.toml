# Gemini models the gateway tries, in order, for each job class (ROADMAP 3.8, DECISIONS #27 and #28).
# It moves to the next entry on 429, 5xx or timeout.
#   light: route, plan, pick-and-quote, claim extraction.
#   main:  Beaver code, Chameleon vision, Cat verdicts.
#
# Verified live (P8b): all six names are listed for the key, and four real runs worked. To re-check:
#   docker compose run --rm api python scripts/list_models.py
# Every chain entry has now been called live (P9): gemini-3.8-flash, thinking_budget 0 and
# gemini-3.6-flash, thinking_budget 1024 both returned HTTP 200. NOT yet called: nothing in the chains.
#
# Per entry, all changeable here without code:
#   timeout_seconds, max_output_tokens, thinking_budget OR thinking_level (not both).
# Verified live (P8b): gemini-3.5-flash-lite answers HTTP 400 to thinkingBudget 0 and works with
# thinkingLevel "minimal"; gemini-3.1-flash-lite accepts budget 0; gemini-3.8-flash accepts budget
# 1024 and does not support "minimal". The thinkingLevel request shape was confirmed by live 200
# responses. Also live in P9: budget 0 on gemini-3.8-flash and budget 1024 on gemini-3.6-flash.
# Not verified: whether thinking tokens count against max_output_tokens on 3.x.
# thinking_budget may be left out: then no thinking field is sent and the model uses its default.
# 0 is sent as 0.
# Thinking tokens may count against max_output_tokens (true for gemini-2.5; not checked for 3.x),
# so a small max_output_tokens plus thinking can cut an answer short.
#
# No Pro models. At most 3 entries per chain (ai_calls.attempt is 1 to 3).

# Seconds for the whole chain, all attempts together. Each attempt gets what is left.
total_budget_seconds = 35

[[light]]
name = "gemini-3.5-flash-lite"
timeout_seconds = 12
max_output_tokens = 2048
thinking_level = "minimal"

[[light]]
name = "gemini-3.1-flash-lite"
timeout_seconds = 12
max_output_tokens = 2048
thinking_budget = 0

[[light]]
name = "gemini-3.8-flash"
timeout_seconds = 20
max_output_tokens = 2048
thinking_budget = 0

[[main]]
name = "gemini-3.8-flash"
timeout_seconds = 20
max_output_tokens = 8192
thinking_budget = 1024

[[main]]
name = "gemini-3.6-flash"
timeout_seconds = 20
max_output_tokens = 8192
thinking_budget = 1024

[[main]]
name = "gemini-3.5-flash-lite"
timeout_seconds = 12
max_output_tokens = 8192
thinking_level = "minimal"

# Embeddings (P14a part 2): ONE model, retries on the SAME model only, never another model. Vectors from
# two different models cannot be compared, so a fallback model would break search on stored vectors.
# NOT VERIFIED live: the owner checks this id with `python scripts/list_models.py --embed` in P14b.
#   dimensions: asked from the model as outputDimensionality; must equal the vector(768) column.
#   attempts:   tries on the same model for one batch (1 to 3), inside the total budget above.
#   batch_size: texts per request. Kept small so the answer stays under the 2 MB body limit.
[[embed]]
name = "gemini-embedding-2"
timeout_seconds = 20
dimensions = 768
attempts = 2
batch_size = 32
