# Gemini models the gateway tries, in order (ROADMAP 3.8). It moves to the next one on 429, 5xx or timeout.
#
# UNVERIFIED: these names have not been checked against a real key. Run
#   docker compose run --rm api python scripts/list_models.py
# first, and fix any name it does not list. Nothing here has run against real Gemini.
#
# No Pro models. At most 3 entries (ai_calls.attempt is 1 to 3).

# Seconds for the whole chain, all attempts together. Each attempt gets what is left.
total_budget_seconds = 35

[[chain]]
name = "gemini-2.5-flash"
timeout_seconds = 20
max_output_tokens = 4096
thinking_budget = 1024

[[chain]]
name = "gemini-2.5-flash-lite"
timeout_seconds = 12
max_output_tokens = 4096
thinking_budget = 0
