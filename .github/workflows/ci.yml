name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: indesk
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: indesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indesk -d indesk"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://indesk:ci_only_password@localhost:5432/indesk
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy .
      - run: pytest

  # Builds the sandbox image in test mode and runs the tests that need the running service.
  sandbox:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.sandbox-test.yaml
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait sandbox redis
      - run: docker compose run --rm --build worker pytest -m sandbox -q
      - if: failure()
        run: docker compose logs sandbox
      - if: always()
        run: docker compose down -v

  # Builds the PDF parser service and runs the tests that need it. They run in the api container,
  # the only one on parse_net (the worker, which the sandbox job uses, is not).
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait parser db redis
      - run: docker compose run --rm --build api pytest -m parser -q
      - if: failure()
        run: docker compose logs parser
      - if: always()
        run: docker compose down -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
