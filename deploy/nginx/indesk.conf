# Indesk on the host nginx. Port 80 only: `certbot --nginx -d indesk.76-13-198-17.sslip.io` adds the 443 part and
# the redirect, the same way it did for Ticketzy. No `map` block here: ticketzy.conf already defines one at http
# level and the run stream (Server-Sent Events) needs no upgrade header.
server {
    listen 80;
    listen [::]:80;
    server_name indesk.76-13-198-17.sslip.io;

    # 5 MB file limit (api/config/limits.toml) + multipart overhead + margin. Raise it with the file limit.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not reach the API.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The live run stream: no buffering, no compression, long read timeout (the stream lasts up to 330 s).
    location ~ ^/api/runs/[^/]+/events$ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
